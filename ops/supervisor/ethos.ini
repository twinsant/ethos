[program:ethos-driver]
command=/opt/ethos/bin/driver.linux.x86_64 /opt/ethos/lib/config.ini
directory=/opt/ethos
user=ethos
autostart=true
autorestart=true
startsecs=5
priority=10
stdout_logfile=/var/log/ethos/driver.log
stderr_logfile=/var/log/ethos/driver-error.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

[program:ethos-web]
command=/opt/ethos/ops/run-web.sh
directory=/opt/ethos
user=ethos
autostart=true
autorestart=true
startsecs=5
priority=20
stdout_logfile=/var/log/ethos/web.log
stderr_logfile=/var/log/ethos/web-error.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
